<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proview dashboard</title>
<meta name="description" content="Sign in once to your Proview apps.">
<link rel="icon" type="image/png" href="icon-32.png?v=2">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #F5F7FA; --card: #FFFFFF; --ink: #1A2330; --ink2: #3D4955; --muted: #5B6672; --line: #E2E8F0; --line-input: #8793A0;
    --brand: #1565C0; --brand-dark: #0D47A1; --brand-soft: #E8F1FC;
    --ok: #127a46; --ok-soft: #e6f5ec; --bad: #b42318; --bad-soft: #fdecea; --none-soft: #eef0f3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font: 15px/1.5 "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input { font: inherit; color: inherit; }
  main { max-width: 440px; margin: 0 auto; padding: 48px 20px 40px; }
  .brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 22px; }
  .brand img { width: 36px; height: 36px; border-radius: 22%; }
  .wordmark { font-weight: 700; font-size: 19px; letter-spacing: .04em; }
  .wordmark span { background: linear-gradient(90deg, #4FA3E0, #7A5FD0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 26px; box-shadow: 0 8px 30px rgba(16, 24, 40, .06); }
  h1 { font-size: 24px; line-height: 32px; margin: 0 0 6px; }
  p.sub { color: var(--muted); margin: 0 0 18px; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
  input[type=email], input[type=password] { width: 100%; height: 46px; border: 1px solid var(--line-input); border-radius: 10px; padding: 0 14px; background: #fff; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #90caf9; outline-offset: 2px; }
  .go { width: 100%; height: 48px; margin-top: 20px; border: 0; border-radius: 10px; background: var(--brand); color: #fff; font-weight: 600; font-size: 16px; cursor: pointer; }
  .go:hover { background: var(--brand-dark); }
  .go:disabled { opacity: .6; cursor: default; }
  .links { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .warn { border: 1px solid #f0c36d; background: #fff8e6; border-radius: 12px; padding: 12px 16px; display: grid; gap: 6px; color: #5c4400; }
  .warn .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
  .warn button:not(.linkbtn) { height: 36px; padding: 0 14px; border-radius: 10px; border: 0; background: var(--brand); color: #fff; font-weight: 600; cursor: pointer; }
  .warn button.ghost { background: #fff; color: var(--brand); border: 1px solid var(--line); }
  .linkbtn { background: none; border: 0; padding: 4px 0; color: var(--brand); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .notice { border-radius: 10px; padding: 10px 14px; margin: 0 0 14px; font-size: 14px; }
  .notice.bad { background: var(--bad-soft); color: var(--bad); }
  .notice.ok { background: var(--ok-soft); color: var(--ok); }
  .notice.info { background: var(--brand-soft); color: var(--brand-dark); }
  .master-note a { color: inherit; font-weight: 700; white-space: nowrap; }
  .apps { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
  .app { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .app .ic { width: 44px; height: 44px; border-radius: 11px; display: block; flex: none; }
  .app .t { flex: 1; min-width: 0; }
  .app .t b { display: block; }
  .app .t small { color: var(--muted); display: block; }
  .app button { height: 40px; padding: 0 16px; border-radius: 10px; border: 0; background: var(--brand); color: #fff; font-weight: 600; cursor: pointer; flex: none; }
  .app.off { background: #fafbfc; }
  .app.off .ic { filter: grayscale(1); opacity: .45; }
  /* Active / Inactive apps (owner, 19 Nov 2026) */
  h2.sec { font-size: 15px; line-height: 22px; margin: 22px 0 0; display: flex; align-items: center; gap: 8px; }
  h2.sec:first-of-type { margin-top: 6px; }
  h2.sec .n { min-width: 22px; height: 22px; border-radius: 11px; background: var(--none-soft); color: var(--muted); font-size: 12px; font-weight: 700; text-align: center; line-height: 22px; padding: 0 6px; }
  h2.sec.on .n { background: var(--ok-soft); color: var(--ok); }
  p.secsub { color: var(--muted); font-size: 13.5px; margin: 2px 0 0; }
  .app.off .t b { color: var(--ink2); }
  .app.off button.trial { background: #fff; color: var(--brand); border: 1px solid var(--brand); }
  .app.off button.trial:hover { background: var(--brand-soft); }
  .app.off button.trial.done { border-color: var(--line); color: var(--muted); background: var(--none-soft); }
  .app.off .grant { color: var(--muted); font-size: 13px; flex: none; max-width: 40%; text-align: right; }
  .app.off small.req { color: var(--ok); }
  li.trialf { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: #fff; display: grid; gap: 8px; }
  li.trialf b { font-size: 15px; }
  li.trialf p { margin: 0; color: var(--muted); font-size: 13.5px; }
  li.trialf label { margin: 4px 0 0; font-size: 13.5px; }
  li.trialf input, li.trialf textarea { width: 100%; border: 1px solid var(--line-input); border-radius: 10px; padding: 9px 12px; background: #fff; font: inherit; }
  li.trialf input { height: 42px; }
  li.trialf textarea { min-height: 64px; resize: vertical; }
  li.trialf textarea:focus-visible { outline: 3px solid #90caf9; outline-offset: 2px; }
  li.trialf .acts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  li.trialf .acts button:not(.linkbtn) { height: 40px; padding: 0 18px; border-radius: 10px; border: 0; background: var(--brand); color: #fff; font-weight: 600; cursor: pointer; }
  li.trialf .acts button:disabled { opacity: .6; cursor: default; }
  li.trialmsg { list-style: none; }
  li.trialmsg .notice { margin: 0; }
  @media (max-width: 420px) {
    .app { gap: 12px; padding: 12px 12px; }
    .app .ic { width: 40px; height: 40px; }
    .app button { padding: 0 12px; }
  }
  .who { color: var(--muted); font-size: 14px; margin: 0 0 16px; word-break: break-all; }
  .foot { text-align: center; color: var(--muted); font-size: 13px; margin-top: 18px; }
  .spin { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%; animation: s 1s linear infinite; vertical-align: -3px; margin-right: 8px; }
  @keyframes s { to { transform: rotate(1turn); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="icons/dashboard.svg" alt=""><span class="wordmark">PROVIEW<span> DASHBOARD</span></span></div>
  <div class="card" id="view" aria-live="polite"><p><span class="spin" aria-hidden="true"></span>Loading…</p></div>
  <p class="foot">One login for all your Proview apps.</p>
</main>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

const HUB_URL = "https://bpssjfrinjlrnkzhytfr.supabase.co";
const HUB_KEY = "sb_publishable_t-flikzLh-wDUz7ZR5iPBA_ZmPNnkB6";
// Own storage key: the licence admin page on this site uses the default one.
const sb = createClient(HUB_URL, HUB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: "pv-account" } });

const NAMES = { bookings: "Proview Bookings", employee: "Proview Employee", signage: "Proview Signage", label: "Proview Label", wifi: "Proview WiFi", qrmenu: "Proview QR Menu", team: "Proview Team", reservations: "Proview Reservations" };
const qs = new URLSearchParams(location.search);
// Not listed on the dashboard (owner, 19 Nov 2026). Kept in NAMES so an app can still send someone here to sign in.
const HIDDEN = new Set(["bookings", "employee"]);
const APP = NAMES[qs.get("app")] ? qs.get("app") : null;  // set when an app sent the person here to sign in
const RET = qs.get("return") || "";
const HERE = location.origin + location.pathname + (APP ? "?app=" + APP + (RET ? "&return=" + encodeURIComponent(RET) : "") : "");

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const view = (html) => { $("#view").innerHTML = html; };
const note = (msg, kind = "bad") => (msg ? `<div class="notice ${kind}" role="${kind === "bad" ? "alert" : "status"}">${esc(msg)}</div>` : "");
const friendly = (e) => {
  const t = String(e?.message || e || "");
  if (/invalid login credentials/i.test(t)) return "That email or password isn’t right. Try again, or use “Forgot password?”. New to the Proview dashboard? Open the invite email we sent you to set your password.";
  if (/email not confirmed/i.test(t)) return "Confirm your email first: open the link we emailed you.";
  if (/already registered/i.test(t)) return "There’s already a Proview account for this email. Sign in instead.";
  if (/rate limit|too many/i.test(t)) return "Too many attempts. Please wait a minute and try again.";
  return t || "Something went wrong. Please try again.";
};
async function call(body) {
  const { data, error } = await sb.functions.invoke("sso-assert", { body });
  if (error) {
    let msg = error.message;
    try { msg = (await error.context.json()).error || msg; } catch { /* keep */ }
    throw new Error(msg);
  }
  return data;
}

let mode = "signin", recovering = false;
// How the password form was reached: "invite" (a Proview dashboard invite from the licence portal), "recovery" (a
// "choose a password" / reset link) or "change" (Change password while signed in). Invite and recovery links sign the
// person in first (detectSessionInUrl); the form then sets their password and opens their apps.
let pwHow = "change";

function showForm(msg = "", kind = "bad") {
  const up = mode === "signup", reset = mode === "reset";
  const title = reset ? "Reset your password" : up ? "Create your Proview account" : "Sign in";
  const sub = reset ? "We’ll email you a link to choose a new password."
    : up ? "Use the email address you already use with Proview. You’ll get an email to confirm it."
    : APP ? `Sign in to continue to ${NAMES[APP]}.` : "One login for all your Proview apps.";
  const keep = $("#em")?.value || "";
  view(`<h1>${title}</h1><p class="sub">${esc(sub)}</p>${note(msg, kind)}
    <form id="f" novalidate>
      <label for="em">Email</label><input id="em" type="email" autocomplete="email" required value="${esc(keep)}">
      ${reset ? "" : `<label for="pw">Password</label><input id="pw" type="password" autocomplete="${up ? "new-password" : "current-password"}" required ${up ? 'minlength="8"' : ""}>`}
      ${up ? `<label for="pw2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password" required>` : ""}
      <button class="go" id="go">${reset ? "Send reset link" : up ? "Create account" : "Sign in"}</button>
    </form>
    <div class="links">
      ${mode === "signin" ? `<button class="linkbtn" data-m="signup">Create an account</button><button class="linkbtn" data-m="reset">Forgot password?</button>`
        : `<button class="linkbtn" data-m="signin">Back to sign in</button>`}
    </div>`);
  document.querySelectorAll("[data-m]").forEach((b) => (b.onclick = () => { mode = b.dataset.m; showForm(); }));
  $("#f").onsubmit = submit;
  setTimeout(() => (keep && !reset ? $("#pw") : $("#em"))?.focus(), 30);
}

async function submit(ev) {
  ev.preventDefault();
  const email = $("#em").value.trim(), pw = $("#pw")?.value || "", go = $("#go");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return showForm("Enter your email address.");
  if (mode === "signup" && pw.length < 8) return showForm("Use at least 8 characters for your password.");
  if (mode === "signup" && pw !== $("#pw2").value) return showForm("The two passwords don’t match.");
  if (mode === "signin" && !pw) return showForm("Enter your password.");
  go.disabled = true;
  try {
    if (mode === "reset") {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: HERE });
      if (error) throw error;
      mode = "signin"; return showForm("If there’s a Proview account for that email, a reset link is on its way. Your password is the same on all Proview sites.", "ok");
    }
    if (mode === "signup") {
      const { data, error } = await sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: HERE } });
      if (error) throw error;
      if (!data.session) { mode = "signin"; return showForm(`Check your inbox: we’ve sent a confirmation link to ${email}. Open it to finish setting up.`, "ok"); }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error) throw error;
    }
    await signedIn();
  } catch (e) { showForm(friendly(e)); }
}

async function showNewPassword(msg = "") {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { recovering = false; mode = "signin"; return showForm("That link has expired or was already used. Use “Forgot password?” below to get a new one."); }
  const em = session.user?.email || "";
  const title = pwHow === "change" ? "Choose a new password" : "Set your password";
  const sub = pwHow === "invite" ? `Welcome to Proview. Choose a password for ${em}. It is your one password for every Proview site: here and the sign-in page of each Proview app.`
    : pwHow === "recovery" ? `Choose a password for ${em}. It is your one password for every Proview site: here and the sign-in page of each Proview app.`
    : "At least 8 characters. Your password is the same on all Proview sites, so this changes it everywhere.";
  view(`<h1>${title}</h1><p class="sub">${esc(sub)}${pwHow === "change" ? "" : " At least 8 characters."}</p>${note(msg)}
    <form id="np" novalidate>
      <label for="n1">New password</label><input id="n1" type="password" autocomplete="new-password" minlength="8" required>
      <label for="n2">Confirm new password</label><input id="n2" type="password" autocomplete="new-password" required>
      <button class="go" id="go">${pwHow === "change" ? "Save password" : "Set password and continue"}</button>
    </form>`);
  setTimeout(() => $("#n1").focus(), 30);
  $("#np").onsubmit = async (ev) => {
    ev.preventDefault();
    const a = $("#n1").value;
    if (a.length < 8) return showNewPassword("Use at least 8 characters.");
    if (a !== $("#n2").value) return showNewPassword("The two passwords don’t match.");
    $("#go").disabled = true;
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) return showNewPassword(friendly(error));
    const first = pwHow === "invite";
    recovering = false; pwHow = "change";
    await signedIn(first ? "Password set. Welcome to Proview. Use it on every Proview site." : "Password saved. It is now your password on every Proview site.");
  };
}

async function openApp(app) {
  view(`<p><span class="spin" aria-hidden="true"></span>Opening ${esc(NAMES[app])}…</p>`);
  try {
    const { url } = await call({ action: "go", app, return: app === APP ? RET : "" });
    location.replace(url);
  } catch (e) {
    await showApps(e.message, "bad");
  }
}

// From the apps list: open the app in a NEW TAB and keep the dashboard here.
// Each app gets its own named tab ("proview-<app>"). If that tab is already open, warn instead of opening a second copy.
// The tab is opened inside the click (so pop-up blockers allow it), then sent to the app's one-time sign-in link.
const appTabs = {};
function tabOpen(w) { try { return !!w && !w.closed; } catch (_) { return false; } }
function showAlreadyOpen(app, btn) {
  const li = btn.closest("li");
  document.querySelectorAll("li.warn").forEach(w => w.remove());   // only ever one warning on the page
  const box = document.createElement("li");
  box.className = "warn";
  box.setAttribute("role", "alert");
  box.innerHTML = `<b>${esc(NAMES[app])} is already open in another tab.</b>
    <span>Opening it twice can mean working in two out-of-date copies.</span>
    <span class="acts"><button type="button" data-go>Go to that tab</button><button type="button" class="ghost" data-fresh>Open a fresh copy</button><button type="button" class="linkbtn" data-x>Cancel</button></span>`;
  li.after(box);
  box.querySelector("[data-go]").onclick = () => { box.remove(); try { appTabs[app].focus(); } catch (_) {} };
  box.querySelector("[data-fresh]").onclick = () => { box.remove(); openAppInNewTab(app, btn, true); };
  box.querySelector("[data-x]").onclick = () => box.remove();
}
async function openAppInNewTab(app, btn, fresh = false) {
  if (!fresh && tabOpen(appTabs[app])) return showAlreadyOpen(app, btn);
  const tab = window.open("", "proview-" + app);
  if (!tab) return openApp(app);
  if (!fresh) {
    // A tab with this name may survive a dashboard reload: if it's already showing the app, warn.
    let existing = false;
    try { existing = tab.location.href !== "about:blank"; } catch (_) { existing = true; }   // cross-site = the app is loaded
    if (existing) { appTabs[app] = tab; try { window.focus(); } catch (_) {} return showAlreadyOpen(app, btn); }
  }
  appTabs[app] = tab;
  try {
    tab.document.title = "Opening " + NAMES[app] + "…";
    tab.document.body.style.cssText = "font:16px system-ui,sans-serif;color:#334;display:grid;place-items:center;height:90vh";
    tab.document.body.textContent = "Opening " + NAMES[app] + "…";
  } catch (_) {}
  const label = btn.innerHTML; btn.disabled = true; btn.textContent = "Opening…";
  try {
    const { url } = await call({ action: "go", app, return: "" });
    tab.location.replace(url);
  } catch (e) {
    try { tab.close(); } catch (_) {}
    await showApps(e.message, "bad");
    return;
  }
  btn.disabled = false; btn.innerHTML = label;
}

// ---------- Request trial (inactive apps) ----------
// One row per request in the hub's public.lic_trial_requests. The database takes the email and time from the session
// (never from here), allows one open ("new") request per person per app, and lets only the master read everyone's.
let TRIALS = {};   // app -> this person's open request { created_at }
const fmtDay = (d) => new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
async function myTrialRequests(email) {
  // filter on the email too: the master can read every request
  const { data, error } = await sb.from("lic_trial_requests").select("app,status,created_at").eq("email", String(email || "").toLowerCase()).eq("status", "new");
  if (error) throw error;
  return Object.fromEntries((data || []).map((r) => [r.app, r]));
}
function clearTrialUi() { document.querySelectorAll("li.trialf, li.trialmsg").forEach((x) => x.remove()); }
function showRequested(app, btn) {
  clearTrialUi();
  const r = TRIALS[app]; const li = btn.closest("li");
  const box = document.createElement("li"); box.className = "trialmsg";
  box.innerHTML = `<div class="notice ok" role="status">Requested on ${esc(fmtDay(r?.created_at || Date.now()))}, we’ll be in touch.</div>`;
  li.after(box);
}
function markRequested(app, btn, r) {
  TRIALS[app] = r;
  const li = btn.closest("li");
  btn.classList.add("done"); btn.innerHTML = `Requested<span class="sr"> (${esc(NAMES[app] || app)})</span>`;
  const sm = li.querySelector(".t small"); if (sm) { sm.className = "req"; sm.textContent = "Trial requested " + fmtDay(r.created_at); }
}
function trialClick(app, btn, name) {
  if (TRIALS[app]) return showRequested(app, btn);
  clearTrialUi();
  const li = btn.closest("li");
  const box = document.createElement("li"); box.className = "trialf";
  box.innerHTML = `<form novalidate><b>Request a trial of ${esc(name)}</b>
    <p>We’ll get back to you to set it up. Nothing changes on your account until then.</p>
    <label for="trBiz">Business name <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input id="trBiz" maxlength="120" autocomplete="organization">
    <label for="trNote">Note <span style="font-weight:400;color:var(--muted)">(optional)</span></label><textarea id="trNote" maxlength="500" placeholder="e.g. how many locations or TVs"></textarea>
    <div class="trerr"></div>
    <div class="acts"><button type="submit" id="trSend">Send</button><button type="button" class="linkbtn" id="trX">Cancel</button></div></form>`;
  li.after(box);
  box.querySelector("#trX").onclick = () => { box.remove(); btn.focus(); };
  box.querySelector("form").onsubmit = async (ev) => {
    ev.preventDefault();
    const send = box.querySelector("#trSend"); send.disabled = true; send.textContent = "Sending…";
    const business = box.querySelector("#trBiz").value.trim().slice(0, 120) || null, note_ = box.querySelector("#trNote").value.trim().slice(0, 500) || null;
    const { data, error } = await sb.from("lic_trial_requests").insert({ app, business, note: note_ }).select("id,app,status,created_at").single();
    if (error && error.code === "23505") {   // already asked (e.g. in another tab): show when
      try { TRIALS = await myTrialRequests((await sb.auth.getUser()).data.user?.email); } catch (_) {}
      box.remove(); markRequested(app, btn, TRIALS[app] || { created_at: new Date().toISOString() }); return showRequested(app, btn);
    }
    if (error) { send.disabled = false; send.textContent = "Send"; box.querySelector(".trerr").innerHTML = note(friendly(error)); return; }
    box.remove(); markRequested(app, btn, data);
    const done = document.createElement("li"); done.className = "trialmsg";
    done.innerHTML = `<div class="notice ok" role="status">Trial request sent for ${esc(name)}. We’ll be in touch.</div>`;
    btn.closest("li").after(done);
    sb.functions.invoke("trial-request-notify", { body: { id: data.id } }).catch(() => {});   // optional email to the master
  };
  setTimeout(() => box.querySelector("#trBiz").focus(), 30);
}

async function showApps(msg = "", kind = "ok") {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return showForm();
  view(`<h1>Your Proview apps</h1><p class="who">Signed in as <b>${esc(user.email)}</b></p>${note(msg, kind)}
    <p><span class="spin" aria-hidden="true"></span>Checking your apps…</p>`);
  let apps = [], master = false;
  // The Proview master (the licence portal's admin) has no master view in the apps: customers are opened from the portal.
  const [a, m, t] = await Promise.allSettled([call({ action: "apps" }), sb.rpc("is_lic_admin"), myTrialRequests(user.email)]);
  if (a.status === "fulfilled") apps = a.value.apps.filter((x) => !HIDDEN.has(x.app)); else { msg = a.reason?.message || String(a.reason); kind = "bad"; }
  master = m.status === "fulfilled" && m.value?.data === true;
  TRIALS = t.status === "fulfilled" ? t.value : {};
  // Active apps open as before. Inactive apps (owner, 19 Nov 2026) get "Request trial" instead of Open: it only records a
  // request for the master; nothing is granted automatically (NO_TRIAL). The master grants trials from the licence portal,
  // so his own inactive apps show no request button.
  const active = apps.filter((x) => x.ok), inactive = apps.filter((x) => !x.ok);
  const row = (a) => `<li class="app"><img class="ic" src="icons/${esc(a.app)}.svg" alt="" width="44" height="44">
      <span class="t"><b>${esc(a.name)}</b><small>Ready to open</small></span>
      <button data-app="${a.app}">Open<span class="sr"> ${esc(a.name)}</span></button></li>`;
  const offRow = (a) => { const r = TRIALS[a.app];
    return `<li class="app off" data-off="${esc(a.app)}"><img class="ic" src="icons/${esc(a.app)}.svg" alt="" width="44" height="44">
      <span class="t"><b>${esc(a.name)}</b>${r ? `<small class="req">Trial requested ${esc(fmtDay(r.created_at))}</small>` : `<small>${esc(a.reason || "No account for this email")}</small>`}</span>
      ${master ? `<span class="grant">Grant trials in the licence portal</span>`
        : r ? `<button class="trial done" data-trial="${esc(a.app)}">Requested<span class="sr"> (${esc(a.name)})</span></button>`
        : `<button class="trial" data-trial="${esc(a.app)}">Request trial<span class="sr"> of ${esc(a.name)}</span></button>`}</li>`; };
  view(`<h1>Your Proview apps</h1><p class="who">Signed in as <b>${esc(user.email)}</b></p>${note(msg, kind)}
    ${master ? `<div class="notice info master-note" role="note"><b>Customers are opened from the licence portal.</b> Open the customer there and press <b>Open in &lt;App&gt;</b> to work inside their business. <a href="https://license.proviewcrm.co.uk">Go to the licence portal</a></div>` : ""}
    ${active.length ? `<h2 class="sec on" id="secActive">Active apps <span class="n">${active.length}</span></h2>
    <ul class="apps" aria-labelledby="secActive">${active.map(row).join("")}</ul>` : ""}
    ${inactive.length ? `<h2 class="sec" id="secInactive">Inactive apps <span class="n">${inactive.length}</span></h2>
    <p class="secsub">${master ? "Not on your Proview account." : "Not on your account yet. Request a trial and we’ll be in touch."}</p>
    <ul class="apps" aria-labelledby="secInactive">${inactive.map(offRow).join("")}</ul>` : ""}
    <div class="links"><button class="linkbtn" id="chg">Change password</button><button class="linkbtn" id="out">Sign out</button></div>`);
  document.querySelectorAll("[data-app]").forEach((b) => (b.onclick = () => openAppInNewTab(b.dataset.app, b)));
  document.querySelectorAll("[data-trial]").forEach((b) => (b.onclick = () => trialClick(b.dataset.trial, b, apps.find((x) => x.app === b.dataset.trial)?.name || NAMES[b.dataset.trial])));
  $("#chg").onclick = () => { pwHow = "change"; showNewPassword(); };
  $("#out").onclick = async () => { await sb.auth.signOut(); mode = "signin"; showForm("You’ve been signed out of your Proview account.", "ok"); };
}

async function signedIn(msg = "") {
  if (recovering) return showNewPassword();
  if (APP) return openApp(APP);
  return showApps(msg);
}

// (no auth calls inside this callback: supabase-js would wait on itself, so the form is shown just after)
sb.auth.onAuthStateChange((ev) => { if (ev === "PASSWORD_RECOVERY") { recovering = true; if (pwHow === "change") pwHow = "recovery"; setTimeout(() => showNewPassword(), 0); } });

const LINK_TYPE = new URLSearchParams(location.hash.slice(1)).get("type");   // read before supabase-js clears the hash
if (LINK_TYPE === "invite" || LINK_TYPE === "recovery") { recovering = true; pwHow = LINK_TYPE; }
(async () => {
  const hp = new URLSearchParams(location.hash.slice(1));
  const linkErr = qs.get("error_description") || hp.get("error_description");
  await new Promise((r) => setTimeout(r, 50)); // let detectSessionInUrl finish
  const { data: { session } } = await sb.auth.getSession();
  if (linkErr) return showForm("That link didn’t work: " + linkErr + ". Sign in below, or use “Forgot password?”.");
  if (recovering) return showNewPassword();
  if (!session) return showForm();
  signedIn(hp.get("type") === "signup" ? "Email confirmed. Welcome to your Proview account." : "");
})();
</script>
</body>
</html>
